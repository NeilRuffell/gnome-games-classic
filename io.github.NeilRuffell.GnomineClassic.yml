id: io.github.NeilRuffell.GnomineClassic
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: gnomine

finish-args:
  - --socket=x11
  - --share=ipc

modules:
  - name: gtk2
    buildsystem: autotools
    build-options:
      cflags: -O2 -g -Wno-error=incompatible-pointer-types -Wno-error=implicit-int -Wno-error=implicit-function-declaration
    config-opts:
      - --disable-gtk-doc
      - --disable-introspection
      - --without-libtiff
    sources:
      - type: archive
        url: https://download.gnome.org/sources/gtk+/2.24/gtk+-2.24.33.tar.xz
        sha256: ac2ac757f5942d318a311a54b0c80b5ef295f299c2a73c632f6bfb1ff49cc6da

  - name: intltool
    buildsystem: simple
    build-commands:
      - sed -i 's:\\${:\\$\\{:' intltool-update.in
      - ./configure --prefix=/app
      - make -j2
      - make install
    cleanup:
      - '*'
    sources:
      - type: archive
        url: https://archive.ubuntu.com/ubuntu/pool/main/i/intltool/intltool_0.51.0.orig.tar.gz
        sha256: 67c74d94196b153b774ab9f89b2fa6c6ba79352407037c8c14d5aeb334e959cd

  - name: gnomine-classic
    buildsystem: simple
    build-commands:
      - python3 fix-configure.py
      - ./configure --prefix=/app --with-platform=gtk-only --with-gtk=2.0 --enable-games=gnomine --with-help-method=file --disable-schemas-install --disable-sound --disable-introspection
      - make -j2
      - make install
      - test -x /app/bin/gnomine
    sources:
      - type: archive
        url: https://download.gnome.org/sources/gnome-games/2.32/gnome-games-2.32.1.tar.gz
        sha256: f0cf083f39938d6256d2a27df5bf629ff6067697b905c82f1a728404b00cec7f
      - type: file
        path: patches/fix-configure.py
