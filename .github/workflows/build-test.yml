name: Test original GNOME Games build

on:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install available classic build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config gettext intltool \
            libgtk2.0-dev libglib2.0-dev libxml2-dev \
            librsvg2-dev libcanberra-gtk-dev

      - name: Download upstream GNOME Games 2.32.1
        run: |
          curl -fL --retry 3 \
            https://download.gnome.org/sources/gnome-games/2.32/gnome-games-2.32.1.tar.gz \
            -o games.tar.gz
          tar -xzf games.tar.gz

      - name: Work around conditional C++ dependency tracking in 2010 configure script
        working-directory: gnome-games-2.32.1
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("configure")
          contents = path.read_text()
          needle = 'if test -z "${am__fastdepCXX_TRUE}" && test -z "${am__fastdepCXX_FALSE}"; then'
          assert contents.count(needle) == 1, "Expected Automake conditional check not found exactly once"
          # Gnomine is a C application. Supply the unused C++ Automake conditional.
          contents = contents.replace(needle, "am__fastdepCXX_TRUE='#'\\nam__fastdepCXX_FALSE=\\n" + needle)
          path.write_text(contents)
          PY

      - name: Inspect and configure original source
        working-directory: gnome-games-2.32.1
        shell: bash
        run: |
          echo "=== Upstream configure options ==="
          ./configure --help | grep -E 'enable-|disable-|with-' | head -100 || true
          echo "=== Compiler and Automake definitions in upstream sources ==="
          grep -nE "AC_PROG_CXX|AM_PROG_CXX|AM_INIT_AUTOMAKE|AC_CONFIG_FILES|AM_CONDITIONAL" configure.ac configure.in 2>/dev/null | head -100 || true
          echo "=== Checking original dependencies ==="
          set +e
          ./configure --prefix=/usr --with-platform=gtk-only --enable-games=gnomine --with-help-method=file > configure-output.log 2>&1
          status=$?
          cat configure-output.log
          if [ "$status" -ne 0 ]; then
            echo "=== Relevant generated configure references ==="
            grep -n -E "am__fastdepCXX|ac_compiler_gnu|CXXDEPMODE" configure | tail -35 || true
            echo "=== Generated Autotools metadata ==="
            grep -n -E "AC_PROG_CXX|AM_PROG_CXX|AM_INIT_AUTOMAKE" configure.ac configure.in 2>/dev/null || true
            echo "::error::Original configure failed; see missing dependency near end of log."
            exit "$status"
          fi

      - name: Attempt compilation
        working-directory: gnome-games-2.32.1
        run: make -j2
