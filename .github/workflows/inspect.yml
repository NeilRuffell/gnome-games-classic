name: Inspect Classic GNOME Games

on:
  push:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download original source
        run: |
          curl -fL --retry 3 \
            https://download.gnome.org/sources/gnome-games/2.32/gnome-games-2.32.1.tar.gz \
            -o games.tar.gz
          tar -xzf games.tar.gz

      - name: Inspect dependencies
        run: |
          cd gnome-games-2.32.1
          ls
          grep -Ein 'PKG_CHECK_MODULES|AC_CHECK_LIB|AM_PATH_' \
            configure.ac || true
